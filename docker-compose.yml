services:

  # ── SQL Server 2022 ────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "SecPerf_Pass123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "2048"   # cap SQL Server buffer pool (~2 GB)
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SecPerf_Pass123!' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── DB init: runs EF migrations + seeds 10k users / 10k products / 100k orders
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: SecPerf.Seeder
        DLL_NAME: SecPerf.Seeder
    environment:
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver;Database=SecPerfBenchmark;
        User Id=sa;Password=SecPerf_Pass123!;
        TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  # ── Minimal API ────────────────────────────────────────────────────────────
  api-minimal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: SecPerf.Api.Minimal
        DLL_NAME: SecPerf.Api.Minimal
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver;Database=SecPerfBenchmark;
        User Id=sa;Password=SecPerf_Pass123!;
        TrustServerCertificate=True;
      Jwt__Secret: "benchmark-secret-key-min-32-characters!!"
      Jwt__Issuer: "secperf-benchmark"
      Jwt__Audience: "secperf-benchmark-users"
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "5001:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Controller-based API ───────────────────────────────────────────────────
  api-controllers:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: SecPerf.Api.Controllers
        DLL_NAME: SecPerf.Api.Controllers
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver;Database=SecPerfBenchmark;
        User Id=sa;Password=SecPerf_Pass123!;
        TrustServerCertificate=True;
      Jwt__Secret: "benchmark-secret-key-min-32-characters!!"
      Jwt__Issuer: "secperf-benchmark"
      Jwt__Audience: "secperf-benchmark-users"
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "5002:8080"
    depends_on:
      api-minimal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Resource monitor — próbkuje CPU/RAM obu API podczas testów k6 ────────────
  resource-monitor:
    image: python:3.12-slim
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - sh
      - -c
      - "pip install docker -q && python /monitor/monitor.py 2700"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./charts:/monitor:ro
      - ./k6/results:/results:rw
    depends_on:
      api-minimal:
        condition: service_healthy
      api-controllers:
        condition: service_healthy
    restart: "no"

  # ── k6 load tests — uruchamia wszystkie scenariusze na obu API ───────────────
  k6:
    image: grafana/k6
    entrypoint: ["/bin/sh", "/scripts/run-docker.sh"]
    volumes:
      - ./k6:/scripts:ro
      - ./k6/results:/results:rw
    depends_on:
      api-minimal:
        condition: service_healthy
      api-controllers:
        condition: service_healthy
    restart: "no"

  # ── OWASP ZAP — Minimal API scan (startuje PO k6) ─────────────────────────
  zap-minimal:
    image: zaproxy/zap-stable
    user: zap
    command: >
      zap-baseline.py
      -t http://api-minimal:8080
      -r minimal-api-report.html
      -x minimal-api-report.xml
      -m 5
      -a
      -I
    volumes:
      - ./security/zap-reports:/zap/wrk:rw
    depends_on:
      k6:
        condition: service_completed_successfully
    restart: "no"

  # ── OWASP ZAP — Controller-based API scan (startuje PO zap-minimal-auth) ──
  zap-controllers:
    image: zaproxy/zap-stable
    user: zap
    command: >
      zap-baseline.py
      -t http://api-controllers:8080
      -r controllers-api-report.html
      -x controllers-api-report.xml
      -m 5
      -a
      -I
    volumes:
      - ./security/zap-reports:/zap/wrk:rw
    depends_on:
      zap-minimal-auth:
        condition: service_completed_successfully
    restart: "no"

  # ── OWASP ZAP — authenticated scan Minimal API ────────────────────────────
  zap-minimal-auth:
    image: zaproxy/zap-stable
    user: zap
    entrypoint: ["/bin/sh", "/scripts/zap-auth-scan.sh"]
    environment:
      TARGET: "http://api-minimal:8080"
      REPORT_BASE: "minimal-api-auth"
    volumes:
      - ./security:/scripts:ro
      - ./security/zap-reports:/zap/wrk:rw
    depends_on:
      zap-minimal:
        condition: service_completed_successfully
    restart: "no"

  # ── OWASP ZAP — authenticated scan Controller-based API ───────────────────
  zap-controllers-auth:
    image: zaproxy/zap-stable
    user: zap
    entrypoint: ["/bin/sh", "/scripts/zap-auth-scan.sh"]
    environment:
      TARGET: "http://api-controllers:8080"
      REPORT_BASE: "controllers-api-auth"
    volumes:
      - ./security:/scripts:ro
      - ./security/zap-reports:/zap/wrk:rw
    depends_on:
      zap-controllers:
        condition: service_completed_successfully
    restart: "no"

  # ── Python charts — generuje wykresy po zakończeniu k6 i ZAP ─────────────
  charts:
    image: python:3.12-slim
    command:
      - sh
      - -c
      - |
        pip install -r /charts/requirements.txt -q &&
        python /charts/generate_charts.py \
          --crud-minimal        /results/crud-load_minimal.json \
          --crud-controllers    /results/crud-load_controllers.json \
          --auth-minimal        /results/auth-flow_minimal.json \
          --auth-controllers    /results/auth-flow_controllers.json \
          --read-minimal        /results/read-heavy_minimal.json \
          --read-controllers    /results/read-heavy_controllers.json \
          --resources           /results/resources.csv \
          --zap-minimal         /zap-reports/minimal-api-report.xml \
          --zap-controllers     /zap-reports/controllers-api-report.xml \
          --zap-minimal-auth    /zap-reports/minimal-api-auth-report.xml \
          --zap-controllers-auth /zap-reports/controllers-api-auth-report.xml
    volumes:
      - ./charts:/charts:ro
      - ./charts/output:/charts/output:rw
      - ./k6/results:/results:ro
      - ./security/zap-reports:/zap-reports:ro
    depends_on:
      zap-minimal-auth:
        condition: service_completed_successfully
      zap-controllers-auth:
        condition: service_completed_successfully
    restart: "no"

volumes:
  sqldata:
